name: Validate design-pattern book

on:
  push:
    paths:
      - "kindle/design-patterns/**"
      - ".github/workflows/validate-design-pattern-book.yml"
  pull_request:
    paths:
      - "kindle/design-patterns/**"
      - ".github/workflows/validate-design-pattern-book.yml"
  workflow_dispatch:
    inputs:
      enforce_release:
        description: "Enforce release readiness"
        required: true
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run push quality gate
        run: python kindle/design-patterns/script/run_completion_gate.py
      - name: Enforce release completion
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce_release }}
        run: python kindle/design-patterns/script/run_completion_gate.py --release
